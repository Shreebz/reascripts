name: Feature request
description: Propose an improvement or new capability
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
      placeholder: As a user, I want... so that...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about
    validations:
      required: false
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Mockups, examples, or related issues
    validations:
      required: false
