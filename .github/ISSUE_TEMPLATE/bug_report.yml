name: Bug report
description: Report unexpected behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A short description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably reproduce the issue
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, REAPER version, SWS/ReaPack versions, and anything else relevant
      placeholder: |
        OS:
        REAPER:
        SWS:
        ReaPack:
    validations:
      required: false
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Logs, screenshots, or related links
    validations:
      required: false
